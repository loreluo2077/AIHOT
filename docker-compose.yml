# docker compose up -d --build     → web on 127.0.0.1:${PORT:-3100} (the admin is at /admin)
# Two containers: app (api+worker together; deploy/app-entrypoint.sh runs migrations, then both
# processes) and web (SSR only, no database access or secrets — see AGENTS.md). Postgres is NOT
# bundled: point DATABASE_URL in .env at this host's existing instance. HTTPS and the public domain are
# this host's own reverse proxy (not Caddy); web only binds the loopback port the proxy forwards to.
name: aifomo

x-image: &image
  build: .
  image: aifomo-app
  restart: unless-stopped
  # Matches this host's other compose stacks (json-file with a cap, so a long-running worker/web
  # can't fill the disk) and keeps `docker logs` timestamps in the same timezone as the rest of the box.
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  # api (HTTP :3001, internal-only) + worker (jobs, schedules) in one container: same image, same
  # deployment, same secrets and database access. deploy/app-entrypoint.sh migrates and seeds once at
  # boot (replacing the separate one-shot "setup" container), then starts both and forwards docker
  # stop's SIGTERM to both so the worker can finish an in-flight paid call (up to ~195s; see
  # stop_grace_period below and apps/worker/src/main.ts).
  app:
    <<: *image
    container_name: aifomo-app
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      AIHOT_DATA_DIR: /data
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      # No proxy in front limits pushes to /api/ingest/items: the api does (per client and minute; 0 turns it off).
      INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["bash", "deploy/app-entrypoint.sh"]
    volumes:
      - data:/data
    # For a PostgreSQL listening on the host itself: DATABASE_URL's host is then host.docker.internal.
    # Unused (and harmless) when the database is reached over 1panel-network below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 210s
    networks:
      - default
      - 1panel-network

  web:
    <<: *image
    container_name: aifomo-web
    # No env_file here on purpose: web never gets DATABASE_URL or any backend secret, only the handful
    # of settings below. SSR reads the api over HTTP (api.server.ts), it never touches the database.
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      API_BASE_URL: http://app:3001
      SITE_URL: ${SITE_URL:-http://localhost:3100}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    command: ["node", "apps/web/server.ts"]
    ports:
      - "${PORT:-127.0.0.1:3100}:3000"
    depends_on:
      - app

networks:
  # This host's existing network (1Panel): lets the app container reach the Postgres container already
  # running there by its container/service name, without publishing a new port.
  1panel-network:
    external: true

volumes:
  data: {}
